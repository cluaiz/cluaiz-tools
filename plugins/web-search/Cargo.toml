[package]
name = "cluaiz_plugin_web_search"
version = "0.2.0"
edition = "2021"
authors = ["Cluaiz Technologies"]
description = "Web search and page reading for the Cluaiz Engine, as one WebAssembly file"

[lib]
crate-type = ["cdylib"]

[dependencies]
scraper = { version = "0.29", default-features = false }
serde_json = "1.0"
urlencoding = "2.1.3"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
