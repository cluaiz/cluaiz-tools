[package]
name = "cluaiz_plugin_text"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "preserve_order", "arbitrary_precision"] }
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
md5 = { package = "md-5", version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
